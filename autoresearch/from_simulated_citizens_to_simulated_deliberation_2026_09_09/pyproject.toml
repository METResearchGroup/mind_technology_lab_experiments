[project]
name = "autoresearch-simulated-deliberation-2026-09-09"
version = "0.1.0"
description = "Replication of arXiv:2609.07573 with Qwen3.5-4B and a Vercel dashboard."
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.0.0",
    "huggingface-hub>=0.30.0",
    "numpy>=2.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
