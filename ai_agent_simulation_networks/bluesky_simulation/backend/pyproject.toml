[project]
name = "bluesky-simulation-backend"
version = "0.1.0"
description = "Backend for Bluesky AI Agent Simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "atproto",
    "pydantic",
    "langgraph",
    "langchain-openai",
    "opik",
    "sqlite-utils",
    "python-dotenv",
    "httpx"
]

[tool.uv]
dev-dependencies = [
    "pytest",
    "httpx"
]
