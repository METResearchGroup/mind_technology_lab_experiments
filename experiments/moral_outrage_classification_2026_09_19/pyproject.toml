[project]
name = "moral-outrage-classification"
version = "0.1.0"
description = "Compare Jev, Perspective, and Bedrock on Brady 2021 moral outrage labels."
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.35.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
    "typesafe-sdk>=0.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
