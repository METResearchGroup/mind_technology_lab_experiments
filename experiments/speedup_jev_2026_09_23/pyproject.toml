[project]
name = "speedup-jev"
version = "0.1.0"
description = "Measure how batching posts into one TypeSafe Jev request changes latency, cost, and quality."
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.35.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.7.0",
    "typesafe-sdk>=0.7.0",
]

[tool.uv]
package = false
